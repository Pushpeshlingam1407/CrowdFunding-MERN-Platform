services:
  - type: web
    name: crowdfunding-backend
    env: docker
    rootDir: Project/Backend-java
    plan: free
    healthCheckPath: /
    envVars:
      - key: SPRING_DATASOURCE_URL
        value: "jdbc:mysql://<AIVEN_MYSQL_HOST>:<PORT>/<DATABASE>?sslMode=REQUIRED"
      - key: SPRING_DATASOURCE_USERNAME
        value: "your_aiven_username"
      - key: SPRING_DATASOURCE_PASSWORD
        value: "your_aiven_password"
